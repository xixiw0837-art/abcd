<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101522"><title>极限反应 · 别点红色</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#f7f9ff;background:#101522}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:20px}main{width:min(100%,500px);text-align:center}h1{font-size:clamp(30px,8vw,48px);margin:8px 0}p{color:#b8c2d8;line-height:1.7}.stats{display:flex;gap:10px;margin:22px 0}.stat{flex:1;background:#1e293d;border-radius:18px;padding:13px}.stat b{display:block;font-size:30px}.stat small{color:#aab5cd}.arena{height:min(55vh,420px);min-height:280px;background:#1a2335;border:1px solid #35425a;border-radius:26px;position:relative;overflow:hidden;touch-action:manipulation;display:flex;justify-content:center;align-items:center}.tile{position:absolute;width:72px;height:72px;border:0;border-radius:22px;box-shadow:0 8px 20px #0004;cursor:pointer;transition:transform .1s;touch-action:manipulation}.tile:active{transform:scale(.9)}.green{background:#39dd8c}.red{background:#ff5b72}.message{padding:24px;font-size:20px;line-height:1.7}button.primary{border:0;border-radius:16px;background:#77e2a6;color:#10251b;font-size:18px;font-weight:800;padding:15px 30px;margin:20px 6px;cursor:pointer}button.secondary{background:#2b3750;color:white}#feedback{min-height:25px;margin-top:10px;font-weight:700}.good{color:#63eaa4}.bad{color:#ff7789}</style></head><body><main><div>⚡ 30 秒挑战</div><h1>极限反应</h1><p>只点绿色，不碰红色！越快得分越高。</p><div class="stats"><div class="stat"><b id="score">0</b><small>得分</small></div><div class="stat"><b id="time">30</b><small>剩余秒数</small></div><div class="stat"><b id="best">0</b><small>历史最高</small></div></div><div id="arena" class="arena"><div class="message">准备好测试你的反应速度了吗？<br>绿色 +1 分，红色 -2 分。</div></div><div id="feedback" aria-live="polite"></div><button id="start" class="primary">开始挑战</button><button id="share" class="primary secondary" hidden>分享成绩</button><p style="font-size:12px">完全离线运行 · 最高分仅保存在本机</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),arena=$('arena'),scoreEl=$('score'),timeEl=$('time'),bestEl=$('best'),start=$('start'),share=$('share'),feedback=$('feedback');let score=0,time=30,running=false,clock=null,spawn=null;let best=0;try{best=Number(localStorage.getItem('reaction-best')||0)||0}catch(e){}bestEl.textContent=best;function clear(){clearInterval(clock);clearTimeout(spawn);arena.replaceChildren()}function next(){if(!running)return;arena.replaceChildren();const green=Math.random()<.72,btn=document.createElement('button');btn.className='tile '+(green?'green':'red');btn.setAttribute('aria-label',green?'绿色方块':'红色方块');const maxX=Math.max(0,arena.clientWidth-82),maxY=Math.max(0,arena.clientHeight-82);btn.style.left=(5+Math.random()*maxX)+'px';btn.style.top=(5+Math.random()*maxY)+'px';btn.addEventListener('click',()=>{if(!running)return;score=Math.max(0,score+(green?1:-2));scoreEl.textContent=score;feedback.textContent=green?'漂亮！+1':'哎呀！-2';feedback.className=green?'good':'bad';clearTimeout(spawn);next()},{once:true});arena.append(btn);spawn=setTimeout(next,Math.max(420,1300-score*22))}function end(){running=false;clear();start.hidden=false;start.textContent='再玩一次';share.hidden=false;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('reaction-best',String(best))}catch(e){}}const m=document.createElement('div');m.className='message';m.textContent='挑战结束！你拿到了 '+score+' 分 🎉';arena.append(m);feedback.textContent=score===best?'刷新或追平最高分！':'再来挑战最高分！';feedback.className='good'}start.addEventListener('click',()=>{clear();score=0;time=30;running=true;scoreEl.textContent=0;timeEl.textContent=30;feedback.textContent='';start.hidden=true;share.hidden=true;next();clock=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)end()},1000)});share.addEventListener('click',async()=>{const text='我在《极限反应：别点红色》30 秒挑战拿到了 '+score+' 分！你能超过我吗？';try{if(navigator.share)await navigator.share({title:'极限反应',text,url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(text+' '+location.href);feedback.textContent='成绩已复制'}else feedback.textContent=text}catch(e){if(e.name!=='AbortError')feedback.textContent='分享失败，请截图分享'}})})();
</script></body></html>
