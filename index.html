<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d1f"><title>NEON RUSH · 极限反应</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:white;background:#090d1f}body{min-height:100dvh;display:grid;place-items:center;overflow-x:hidden}body:before{content:"";position:fixed;inset:-40%;z-index:-1;background:radial-gradient(ellipse at 20% 20%,#6124a077,transparent 32%),radial-gradient(ellipse at 80% 70%,#0076af66,transparent 35%),#090d1f;animation:drift 15s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(6%, -5%) rotate(12deg)}}main{width:min(100%,520px);padding:18px 16px 30px;text-align:center}.eyebrow{letter-spacing:.35em;font-size:11px;color:#75fbe4;font-weight:800}h1{margin:7px 0 4px;font-size:clamp(38px,10vw,56px);letter-spacing:.04em;text-shadow:0 0 30px #bd54ff88}h1 span{color:#80ffe5}p{color:#aeb9d6;margin:7px 0 15px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.stat{padding:13px 5px;background:#ffffff0e;border:1px solid #ffffff20;border-radius:18px;backdrop-filter:blur(10px)}.stat b{display:block;font-size:30px;font-variant-numeric:tabular-nums}.stat small{color:#a8b7d1;font-size:11px}.stat:nth-child(2) b{color:#80ffe5}.stat:nth-child(3) b{color:#e6a0ff}.bar{height:6px;background:#ffffff1a;border-radius:10px;overflow:hidden;margin:10px 4px 15px}.bar div{height:100%;width:100%;background:linear-gradient(90deg,#bd66ff,#62ffe4);transition:width 1s linear}.arena{position:relative;height:min(51dvh,430px);min-height:290px;border:1px solid #84fbe055;border-radius:26px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#23305899,#11162ddd 75%);box-shadow:inset 0 0 55px #12a5d018,0 18px 60px #0007;touch-action:manipulation}.arena:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(transparent,#000)}.tile{position:absolute;width:76px;height:76px;border:0;border-radius:23px;cursor:pointer;touch-action:manipulation;animation:pop .16s cubic-bezier(.2,1.8,.5,1)}@keyframes pop{from{transform:scale(.4) rotate(-20deg);opacity:.3}to{transform:scale(1) rotate(0);opacity:1}}.green{background:linear-gradient(145deg,#b4ffe3,#19dca1);box-shadow:0 0 16px #35f6ba,0 0 40px #35f6ba77,inset 0 3px 5px #ffffff88}.red{background:linear-gradient(145deg,#ff9eaf,#ff345d);box-shadow:0 0 16px #ff456c,0 0 40px #ff456c66,inset 0 3px 5px #ffffff77}.tile:after{content:"";position:absolute;inset:18px;border:3px solid #ffffffbb;border-radius:12px}.red:after{border-radius:50%;transform:rotate(45deg)}.intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}.intro .symbol{font-size:65px;filter:drop-shadow(0 0 20px #69ffe4)}.intro h2{font-size:26px;margin:8px}.intro p{font-size:15px;line-height:1.7}.combo{position:absolute;top:15px;left:0;right:0;pointer-events:none;font-size:24px;font-weight:900;color:#fff2a5;text-shadow:0 0 20px #ffca51;z-index:2;animation:pop .2s}.particle{position:absolute;pointer-events:none;width:9px;height:9px;border-radius:50%;animation:burst .55s ease-out forwards;z-index:3}@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}}.floating{position:absolute;pointer-events:none;font-size:22px;font-weight:900;animation:float .7s ease-out forwards;z-index:4}@keyframes float{to{transform:translateY(-65px);opacity:0}}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:16px;padding:15px 26px;font-size:17px;font-weight:900;background:linear-gradient(110deg,#83ffe1,#65c8ff);color:#09213b;box-shadow:0 7px 25px #36e8d855;cursor:pointer}.btn.alt{background:#ffffff1b;color:white;box-shadow:none;border:1px solid #ffffff33}.feedback{min-height:24px;margin-top:9px;color:#80ffe5;font-weight:800}.footer{font-size:11px;color:#8190b1;margin-top:15px}.shake{animation:shake .22s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}[hidden]{display:none!important}
</style></head><body><main><div class="eyebrow">⚡ ARCADE CHALLENGE ⚡</div><h1>NEON <span>RUSH</span></h1><p>30 秒极速反应 · 点击绿色 · 躲开红色</p><div class="stats"><div class="stat"><b id="score">0</b><small>SCORE 得分</small></div><div class="stat"><b id="time">30</b><small>TIME 剩余</small></div><div class="stat"><b id="best">0</b><small>BEST 纪录</small></div></div><div class="bar"><div id="progress"></div></div><div id="arena" class="arena"><div class="intro"><div class="symbol">⚡</div><h2>准备好了吗？</h2><p>🟢 绿色 +1　🔴 红色 -2<br>连续命中，触发连击奖励！</p></div></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="controls"><button id="start" class="btn">▶ 开始挑战</button><button id="share" class="btn alt" hidden>↗ 分享成绩</button><button id="sound" class="btn alt" aria-label="切换声音">🔊</button></div><div class="footer">NEON RUSH v2 · 触屏优化 · 无需下载</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),arena=$('arena'),scoreEl=$('score'),timeEl=$('time'),bestEl=$('best'),start=$('start'),share=$('share'),sound=$('sound'),feedback=$('feedback'),progress=$('progress');let score=0,time=30,combo=0,running=false,clock,spawn,audio,mute=false,best=0;try{best=Number(localStorage.getItem('neon-rush-best')||0)||0}catch(e){}bestEl.textContent=best;function beep(freq=500,type='sine'){if(mute)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,audio.currentTime);osc.frequency.exponentialRampToValueAtTime(Math.max(80,freq*.6),audio.currentTime+.12);gain.gain.setValueAtTime(.06,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.14);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.15)}catch(e){}}function clear(){clearInterval(clock);clearTimeout(spawn);arena.replaceChildren()}function particles(x,y,good){for(let i=0;i<13;i++){const p=document.createElement('div');p.className='particle';p.style.background=good?'#79ffe0':'#ff547e';p.style.left=x+'px';p.style.top=y+'px';const a=Math.random()*Math.PI*2,d=25+Math.random()*65;p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+'px');arena.append(p);setTimeout(()=>p.remove(),600)}}function floatText(x,y,s){const el=document.createElement('div');el.className='floating';el.textContent=s;el.style.left=x+'px';el.style.top=y+'px';el.style.color=s.startsWith('-')?'#ff6687':'#a4ffe4';arena.append(el);setTimeout(()=>el.remove(),750)}function next(){if(!running)return;arena.querySelectorAll('.tile,.combo').forEach(e=>e.remove());const green=Math.random()<.72,btn=document.createElement('button');btn.className='tile '+(green?'green':'red');btn.setAttribute('aria-label',green?'绿色方块':'红色方块');const x=8+Math.random()*Math.max(0,arena.clientWidth-92),y=12+Math.random()*Math.max(0,arena.clientHeight-100);btn.style.left=x+'px';btn.style.top=y+'px';btn.addEventListener('click',()=>{if(!running)return;clearTimeout(spawn);const bonus=green&&combo>0&&(combo+1)%5===0?3:0;combo=green?combo+1:0;const change=green?1+bonus:-2;score=Math.max(0,score+change);scoreEl.textContent=score;beep(green?560+Math.min(combo,15)*35:170,green?'sine':'sawtooth');if(navigator.vibrate)navigator.vibrate(green?12:80);if(!green){arena.classList.remove('shake');void arena.offsetWidth;arena.classList.add('shake')}particles(x+38,y+38,green);floatText(x+15,y,change>0?'+'+change:String(change));feedback.textContent=green?(bonus?'🔥 五连击奖励 +3！':combo>=2?'✨ '+combo+' 连击！':'完美命中！'):'💥 失误！连击中断';next()},{once:true});arena.append(btn);spawn=setTimeout(()=>{combo=0;next()},Math.max(430,1250-score*15))}function end(){running=false;clear();start.hidden=false;start.textContent='↻ 再来一次';share.hidden=false;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('neon-rush-best',String(best))}catch(e){}}const rank=score>=45?'🏆 反应之神':score>=30?'🔥 闪电高手':score>=15?'⚡ 极速新星':'🌟 潜力选手';arena.innerHTML='<div class="intro"><div class="symbol">🏁</div><h2>'+rank+'</h2><p>最终得分：<strong>'+score+'</strong><br>最高纪录：'+best+'</p></div>';feedback.textContent='挑战结束！把成绩分享给朋友吧';progress.style.width='0%';beep(780)}start.addEventListener('click',()=>{clear();score=0;time=30;combo=0;running=true;scoreEl.textContent=0;timeEl.textContent=30;progress.style.width='100%';feedback.textContent='GO!';start.hidden=true;share.hidden=true;beep(700);next();clock=setInterval(()=>{time--;timeEl.textContent=time;progress.style.width=time/30*100+'%';if(time<=0)end()},1000)});sound.addEventListener('click',()=>{mute=!mute;sound.textContent=mute?'🔇':'🔊'});share.addEventListener('click',async()=>{const text='我在 NEON RUSH 30 秒反应挑战拿到 '+score+' 分！你能超过我吗？';try{if(navigator.share)await navigator.share({title:'NEON RUSH 极限反应',text,url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(text+' '+location.href);feedback.textContent='成绩已复制'}else feedback.textContent=text}catch(e){if(e.name!=='AbortError')feedback.textContent='分享失败，请截图分享'}})})();
</script></body></html>
