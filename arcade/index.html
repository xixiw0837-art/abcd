<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>星光街机 四款试玩</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#344b7e,#0a1026);color:white;font-family:-apple-system,sans-serif}main{max-width:520px;margin:auto;text-align:center;padding:16px}h1{margin:5px}p{color:#c5d7eb;font-size:13px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.tabs button,button{border:1px solid #ffffff40;background:#ffffff18;border-radius:13px;padding:12px;color:white;font-weight:700}.tabs .on{background:#2f9ca7}canvas{width:100%;max-height:60dvh;aspect-ratio:3/4;background:#152443;border-radius:20px;touch-action:none;display:block}#play{background:linear-gradient(90deg,#5cdbc4,#4c9ddd);width:100%;font-size:18px;margin-top:10px}#ctrl{display:flex;justify-content:center;gap:12px;margin:10px}#ctrl button{min-width:75px;touch-action:none}#info{min-height:38px}small{color:#afc5d9}</style><main><h1>✦ 星光街机 ✦</h1><p>四款独立玩法 · iPhone 触屏游戏合集</p><div class="tabs"><button data-g="maze">🌀 重力迷宫</button><button data-g="basket">🏀 街头投篮</button><button data-g="ship">🚀 星际穿梭</button><button data-g="jump">🐾 云端冒险</button></div><p id="info"></p><canvas id="c" width="450" height="600"></canvas><button id="play">▶ 开始游戏</button><div id="ctrl"></div><small id="stat"></small></main><script>
(()=>{const $=s=>document.querySelector(s),c=$('#c'),x=c.getContext('2d'),W=450,H=600;let mode='maze',active=false,score=0,best=0,keys={},state={},last=0,drag=false,aim={x:0,y:0},touchX=225;const info={maze:'左右控制重力，让球避开红色障碍进入金色终点',basket:'手指按住篮球向后拖动，松手投篮',ship:'手指左右拖动飞船，躲陨石、收集星星',jump:'按住左右移动，跳跃收集所有星星'};const circle=(a,b,r,color)=>{x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fillStyle=color;x.fill()},rect=(a,b,w,h,color)=>{x.fillStyle=color;x.fillRect(a,b,w,h)},label=(t,a,b,size=22,color='white')=>{x.fillStyle=color;x.font='bold '+size+'px system-ui';x.textAlign='center';x.fillText(t,a,b)},rnd=(a,b)=>a+Math.random()*(b-a);function reset(){score=0;try{best=Number(localStorage.getItem('starlight-'+mode)||0)}catch(e){best=0}state=mode==='maze'?{x:40,y:40,vx:0,vy:0,level:1,walls:[[80,135,300,22],[0,280,290,22],[160,415,290,22]]}:mode==='basket'?{x:90,y:495,vx:0,vy:0,time:60,aim:false,scored:false}:mode==='ship'?{x:225,hp:3,t:0,spawn:0,rocks:[]}: {x:45,y:480,vx:0,vy:0,ground:false,stars:[[100,410],[300,325],[120,235],[310,145]],plats:[[0,535,450],[50,450,110],[230,365,125],[70,280,115],[245,190,115]]};update()}function update(){$('#stat').textContent='得分 '+Math.floor(score)+' · 最高纪录 '+best}function award(n){score+=n;if(score>best){best=Math.floor(score);try{localStorage.setItem('starlight-'+mode,String(best))}catch(e){}}update()}function end(){active=false;$('#play').textContent='↻ 再玩一次';$('#info').textContent='挑战结束！'+info[mode]}function choose(m){mode=m;active=false;reset();$('#info').textContent=info[m];$('#play').textContent='▶ 开始游戏';document.querySelectorAll('[data-g]').forEach(b=>b.classList.toggle('on',b.dataset.g===m));const ctrl=$('#ctrl');ctrl.replaceChildren();if(m==='maze'||m==='jump'){for(const [txt,k] of [['◀ 左','l'],['右 ▶','r'],...(m==='jump'?[['⬆ 跳','j']]:[])]){const b=document.createElement('button');b.textContent=txt;b.onpointerdown=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>keys[k]=false;ctrl.append(b)}}else ctrl.textContent=m==='ship'?'👆 在画面内拖动飞船':'👆 拖动篮球蓄力并松手';document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>choose(b.dataset.g));$('#play').onclick=()=>{reset();active=true;$('#play').textContent='游戏进行中';$('#info').textContent=info[mode]}}function base(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,mode==='basket'?'#563c73':'#2b4777');g.addColorStop(1,'#101b3a');rect(0,0,W,H,g);for(let i=0;i<32;i++)circle((i*139)%W,(i*211)%H,1.5,'#ffffff50')}function maze(dt){const s=state;if(active){s.vx+=((keys.r?1:0)-(keys.l?1:0))*680*dt;s.vy+=520*dt;s.vx*=.98;s.vy*=.99;const oy=s.y,ox=s.x;s.x=Math.max(13,Math.min(W-13,s.x+s.vx*dt));s.y=Math.max(13,Math.min(H-13,s.y+s.vy*dt));for(const [a,b,w,h] of s.walls){if(s.x+12>a&&s.x-12<a+w&&s.y+12>b&&s.y-12<b+h){if(oy+12<=b){s.y=b-12;s.vy=0}else if(oy-12>=b+h){s.y=b+h+12;s.vy=0}else{s.x=ox;s.vx=0}}}if(Math.hypot(s.x-225,s.y-235)<26){s.x=40;s.y=40;s.vx=s.vy=0}if(Math.hypot(s.x-398,s.y-545)<30){award(1);s.level++;s.x=40;s.y=40;s.vx=s.vy=0;if(s.level>6)end()}}for(const [a,b,w,h] of s.walls){rect(a,b,w,h,'#8fd4df');rect(a,b+15,w,7,'#4685a6')}circle(225,235,21,'#f15a84');label('×',225,244,28);circle(398,545,25,'#ffd776');circle(s.x,s.y,13,'#91fff1');label('第 '+s.level+' 关',225,34,18)}function basket(dt){const s=state;if(active){s.time-=dt;if(s.time<=0)end();if(!s.aim&&(s.vx||s.vy)){let prev=s.y;s.vy+=610*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;if(!s.scored&&prev<223&&s.y>=223&&s.vy>0&&s.x>310&&s.x<375){award(3);s.scored=true}if(s.y>H+40||s.x>W+40||s.x< -40){s.x=90;s.y=495;s.vx=s.vy=0;s.scored=false}}}rect(0,560,W,40,'#b27b7d');rect(375,145,10,135,'#e8ecf3');rect(307,220,72,8,'#ff9c67');x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.moveTo(312,228);x.lineTo(323,269);x.lineTo(365,269);x.lineTo(375,228);x.stroke();circle(s.x,s.y,18,'#f7a04e');x.strokeStyle='#7b4325';x.beginPath();x.arc(s.x,s.y,16,0,Math.PI*2);x.moveTo(s.x-16,s.y);x.lineTo(s.x+16,s.y);x.stroke();if(s.aim){x.strokeStyle='#b5ffe9';x.setLineDash([6,6]);x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.x+(s.x-aim.x)*1.3,s.y+(s.y-aim.y)*1.3);x.stroke();x.setLineDash([])}label('剩余 '+Math.ceil(s.time)+' 秒',225,37,19)}function ship(dt){const s=state;if(active){s.t+=dt;s.spawn-=dt;if(s.spawn<=0){s.rocks.push({x:rnd(20,430),y:-25,star:Math.random()<.2,r:rnd(14,26)});s.spawn=Math.max(.23,.7-s.t*.006)}s.x+=(touchX-s.x)*Math.min(1,dt*12);for(const o of s.rocks){o.y+=(230+s.t*4)*dt;if(Math.hypot(o.x-s.x,o.y-510)<o.r+18){o.y=H+100;if(o.star)award(5);else if(--s.hp<=0)end()}}s.rocks=s.rocks.filter(o=>o.y<H+45);award(dt*.7)}for(const o of s.rocks){circle(o.x,o.y,o.r,o.star?'#ffe480':'#b88a9d');if(o.star)label('✦',o.x,o.y+8,24)}x.fillStyle='#94eaff';x.beginPath();x.moveTo(s.x,475);x.lineTo(s.x+23,533);x.lineTo(s.x,521);x.lineTo(s.x-23,533);x.fill();label('❤'.repeat(Math.max(0,s.hp)),72,35,21,'#ff7297')}function jump(dt){const s=state;if(active){s.vx=((keys.r?1:0)-(keys.l?1:0))*240;s.x=Math.max(12,Math.min(W-12,s.x+s.vx*dt));if(keys.j&&s.ground){s.vy=-440;s.ground=false;keys.j=false}const oy=s.y;s.vy+=850*dt;s.y+=s.vy*dt;s.ground=false;for(const [a,b,w] of s.plats){if(s.vy>=0&&oy+14<=b+8&&s.y+14>=b&&s.x+12>a&&s.x-12<a+w){s.y=b-14;s.vy=0;s.ground=true}}s.stars=s.stars.filter(([a,b])=>{if(Math.hypot(s.x-a,s.y-b)<24){award(10);return false}return true});if(!s.stars.length){s.stars=[[100,410],[300,325],[120,235],[310,145]];s.x=45;s.y=480}if(s.y>H+30){s.x=45;s.y=480;s.vy=0}}for(const [a,b,w] of s.plats){rect(a,b,w,14,'#8ee7b9');rect(a,b+12,w,9,'#4c9a93')}for(const [a,b] of s.stars)label('✦',a,b+8,27,'#ffe78a');circle(s.x,s.y,14,'#ffe4bb');circle(s.x-8,s.y-10,8,'#ffe4bb');circle(s.x+8,s.y-10,8,'#ffe4bb');circle(s.x-5,s.y-1,2,'#253e5c');circle(s.x+5,s.y-1,2,'#253e5c')}function loop(t){requestAnimationFrame(loop);const dt=Math.min(.033,(t-last)/1000||.016);last=t;base();({maze,basket,ship,jump})[mode](dt)}function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}c.onpointerdown=e=>{if(!active)return;drag=true;c.setPointerCapture(e.pointerId);const p=point(e);aim=p;touchX=p.x;if(mode==='maze')keys[p.x<W/2?'l':'r']=true;if(mode==='jump'){if(p.x>W*.66)keys.j=true;else keys[p.x<W/2?'l':'r']=true}if(mode==='basket'&&state.vx===0&&state.vy===0)state.aim=true};c.onpointermove=e=>{if(!drag)return;const p=point(e);aim=p;touchX=p.x;if(mode==='maze'){keys.l=p.x<W/2;keys.r=!keys.l}};c.onpointerup=e=>{if(mode==='basket'&&state.aim){const p=point(e);state.vx=Math.max(-650,Math.min(650,(state.x-p.x)*3.4));state.vy=Math.max(-800,Math.min(200,(state.y-p.y)*3.4));state.aim=false}drag=false;keys.l=keys.r=keys.j=false};c.onpointercancel=()=>{drag=false;keys.l=keys.r=keys.j=false};window.onkeydown=e=>{if(e.key==='ArrowLeft')keys.l=true;if(e.key==='ArrowRight')keys.r=true;if(e.key==='ArrowUp'||e.key===' ')keys.j=true};window.onkeyup=e=>{if(e.key==='ArrowLeft')keys.l=false;if(e.key==='ArrowRight')keys.r=false;if(e.key==='ArrowUp'||e.key===' ')keys.j=false};choose('maze');requestAnimationFrame(loop)})();
</script>
