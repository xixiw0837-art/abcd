<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1630"><title>口袋星球 3D</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 45%,#243c70,#0b1127 80%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;min-height:100dvh}main{max-width:560px;margin:auto;padding:16px 13px 28px;text-align:center}h1{margin:4px;font-size:29px}.sub{font-size:12px;color:#b5cce5;margin:5px 0 15px}.stats{display:flex;gap:8px;margin-bottom:10px}.stat{flex:1;background:#ffffff16;border:1px solid #ffffff26;border-radius:14px;padding:10px 4px;font-weight:800}.stat small{display:block;color:#c2cde1;font-size:10px;font-weight:400;margin-top:4px}.viewport{position:relative;aspect-ratio:1;max-height:57dvh;border-radius:25px;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#304d7c,#101b3c 75%);border:1px solid #ffffff30;box-shadow:0 18px 50px #0005}.viewport canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;top:12px;left:12px;padding:7px 11px;border-radius:20px;background:#0b193ca8;font-size:12px;pointer-events:none}.hint{position:absolute;bottom:12px;left:0;right:0;color:#e3f8ff;font-size:12px;text-shadow:0 2px 8px #000;pointer-events:none}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}button{background:#ffffff1b;border:1px solid #ffffff35;border-radius:14px;color:#fff;padding:13px 5px;font-size:14px;font-weight:750;cursor:pointer}button small{display:block;font-weight:400;font-size:10px;color:#c7d5e8;margin-top:5px}.extras{display:flex;gap:8px;margin-top:9px}.extras button{flex:1;font-size:12px;padding:11px 4px}.msg{color:#9cf4da;font-size:13px;min-height:27px;margin-top:12px}.story{text-align:left;border-radius:15px;background:#ffffff12;border:1px solid #ffffff22;padding:13px;margin-top:7px;font-size:13px;line-height:1.7}.story b{color:#ffe4aa}.foot{color:#92a6c2;font-size:10px;margin-top:12px}#fallback{display:none;position:absolute;inset:0;place-items:center;padding:25px;background:#162449;text-align:center}</style></head><body><main><h1>🪐 口袋星球 <span style="font-size:12px;color:#9cf4da">3D</span></h1><div class="sub">一颗真正可以旋转的小小星球 · 建造属于你的世界</div><div class="stats"><div class="stat">🌱 <span id="wood">25</span><small>自然能量</small></div><div class="stat">✨ <span id="dust">10</span><small>星尘</small></div><div class="stat">🏠 <span id="people">0</span><small>居民</small></div></div><div class="viewport" id="viewport"><div class="overlay" id="day">☀️ 晴朗星球</div><div class="hint">👆 手指拖动旋转 · 观看立体建筑</div><div id="fallback">3D 引擎未能加载。请检查网络后刷新网页。</div></div><div class="actions"><button id="tree">🌲 种松树<small>🌱 5</small></button><button id="house">🏡 盖小屋<small>🌱 15 · ✨ 3</small></button><button id="flower">🌸 种花园<small>🌱 8 · ✨ 2</small></button></div><div class="extras"><button id="collect">✨ 收集资源</button><button id="storybtn">💌 居民故事</button><button id="reset">↻ 重开</button></div><div id="msg" class="msg">拖动星球，看看另一面的风景吧！</div><div class="story"><b>📖 星球日记</b><div id="story">宇宙很大，但这里会慢慢变得热闹。</div></div><div class="foot">Pocket Planet 3D v2 · 本地自动存档 · 使用 Three.js WebGL</div></main><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>
(()=>{const $=x=>document.getElementById(x),viewport=$('viewport');if(!window.THREE){$('fallback').style.display='grid';return}const T=THREE,key='pocket-planet-v1';let state={wood:25,stars:10,items:[],angle:0,last:0,story:0};try{const s=JSON.parse(localStorage.getItem(key)||'null');if(s&&Array.isArray(s.items))state={...state,...s}}catch(e){}const elapsed=Math.min(12*3600000,Math.max(0,Date.now()-(state.last||Date.now())));if(elapsed>60000){state.wood+=Math.min(100,Math.floor(elapsed/60000)*(1+state.items.filter(x=>x.type==='tree').length));state.stars+=Math.min(50,Math.floor(elapsed/180000))}const save=()=>{state.last=Date.now();try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}};const msg=s=>$('msg').textContent=s;const update=()=>{$('wood').textContent=Math.floor(state.wood);$('dust').textContent=Math.floor(state.stars);$('people').textContent=state.items.filter(x=>x.type==='house').length*2};const scene=new T.Scene(),camera=new T.PerspectiveCamera(37,1,.1,100);camera.position.set(0,1.1,9.7);camera.lookAt(0,0,0);const renderer=new T.WebGLRenderer({antialias:true,alpha:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=T.SRGBColorSpace;viewport.prepend(renderer.domElement);const world=new T.Group();scene.add(world);scene.add(new T.HemisphereLight(0xd5eeff,0x233d3c,2.1));const sun=new T.DirectionalLight(0xffe5b4,2.8);sun.position.set(-4,7,8);scene.add(sun);const mat=(color,roughness=1)=>new T.MeshStandardMaterial({color,roughness});const land=mat('#68bd89'),sea=mat('#317eaa',.55),trunk=mat('#7e5545'),leaf=mat('#287d64'),leaf2=mat('#65c789'),roof=mat('#f1878a'),wall=mat('#f8dbac'),windowMat=new T.MeshStandardMaterial({color:'#ffe8a0',emissive:'#e6a64a',emissiveIntensity:.35}),pink=mat('#ff91c3'),yellow=mat('#ffe69c');function mesh(g,m,parent,x=0,y=0,z=0){const o=new T.Mesh(g,m);o.position.set(x,y,z);parent.add(o);return o}mesh(new T.SphereGeometry(2.28,64,48),land,world);const ocean=mesh(new T.SphereGeometry(2.29,64,48),new T.MeshStandardMaterial({color:'#60b6c9',transparent:true,opacity:.13,roughness:.5}),world);function patch(lat,lon,r,color){const v=new T.Vector3(Math.cos(lat)*Math.cos(lon),Math.sin(lat),Math.cos(lat)*Math.sin(lon));const o=mesh(new T.SphereGeometry(r,16,12),color,world,...v.clone().multiplyScalar(2.25).toArray());o.scale.set(1.5,.22,1.15);o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),v)}for(let i=0;i<26;i++){const a=i*2.399,l=Math.asin((i%13-6)/8);patch(l,a,.23+(i%4)*.09,i%3?leaf2:sea)}const objects=new T.Group();world.add(objects);function point(i){const a=i*2.399963, y=1-2*((i+.5)%53)/53,r=Math.sqrt(1-y*y);return new T.Vector3(Math.cos(a)*r,y,Math.sin(a)*r)}function decorate(type,i){const normal=point(i),holder=new T.Group();holder.position.copy(normal.clone().multiplyScalar(2.30));holder.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),normal);objects.add(holder);if(type==='tree'){mesh(new T.CylinderGeometry(.045,.065,.38,7),trunk,holder,0,.17,0);for(let j=0;j<3;j++){mesh(new T.ConeGeometry(.23-j*.045,.42,9),j%2?leaf2:leaf,holder,0,.36+j*.17,0)}}else if(type==='house'){mesh(new T.BoxGeometry(.39,.32,.36),wall,holder,0,.17,0);const top=mesh(new T.ConeGeometry(.34,.3,4),roof,holder,0,.49,0);top.rotation.y=Math.PI/4;mesh(new T.BoxGeometry(.10,.12,.012),windowMat,holder,-.10,.2,.19);mesh(new T.BoxGeometry(.10,.12,.012),windowMat,holder,.10,.2,.19);mesh(new T.BoxGeometry(.10,.17,.014),trunk,holder,0,.11,.192)}else{for(let k=0;k<5;k++){const a=k*Math.PI*2/5;mesh(new T.SphereGeometry(.09,9,8),pink,holder,Math.cos(a)*.12,.12,Math.sin(a)*.12)}mesh(new T.SphereGeometry(.09,10,8),yellow,holder,0,.15,0)}}state.items.forEach((x,i)=>decorate(x.type,i));const stars=new T.BufferGeometry(),coords=[];for(let i=0;i<230;i++){coords.push((Math.random()-.5)*22,(Math.random()-.5)*22,(Math.random()-.5)*15-4)}stars.setAttribute('position',new T.Float32BufferAttribute(coords,3));scene.add(new T.Points(stars,new T.PointsMaterial({color:'#d3e7ff',size:.035,transparent:true,opacity:.8})));world.rotation.y=state.angle||0;let dragging=false,prev=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;prev=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(dragging){world.rotation.y+=(e.clientX-prev)*.009;prev=e.clientX}});renderer.domElement.addEventListener('pointerup',()=>{dragging=false;state.angle=world.rotation.y;save()});renderer.domElement.addEventListener('pointercancel',()=>dragging=false);function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(viewport);resize();let tick=0;function animate(){requestAnimationFrame(animate);tick+=.01;if(!dragging)world.rotation.y+=.0015;world.rotation.z=Math.sin(tick*.3)*.035;renderer.render(scene,camera)}animate();const costs={tree:[5,0],house:[15,3],flower:[8,2]};['tree','house','flower'].forEach(type=>$(type).addEventListener('click',()=>{const [w,s]=costs[type];if(state.wood<w||state.stars<s){msg('资源不足！先收集资源 ✨');return}if(state.items.length>=52){msg('星球已经很热闹了！');return}state.wood-=w;state.stars-=s;const i=state.items.length;state.items.push({type});decorate(type,i);if(type==='tree')state.story=Math.max(state.story,1);if(type==='house')state.story=Math.max(state.story,2);if(type==='flower')state.story=Math.max(state.story,3);update();save();msg(({tree:'🌲 松树长出来了！',house:'🏡 新居民搬来了！',flower:'🌸 花园开花了！'})[type])}));$('collect').addEventListener('click',()=>{if(Date.now()-state.last<8000){msg('星球正在积攒能量，几秒后再来 ⏳');return}state.wood+=10+state.items.filter(x=>x.type==='tree').length*2;state.stars+=3+state.items.filter(x=>x.type==='flower').length;save();update();msg('✨ 收集成功！树木和花园提高收益')});$('storybtn').addEventListener('click',()=>{const lines=['宇宙很大，但这里会慢慢变得热闹。','小狐狸阿橘喜欢在松树下看星星。','旅行者米米发现了温暖的小屋，决定住下来。','居民们在花园里举办了第一次星光茶会。'];$('story').textContent=lines[Math.min(state.story,3)];msg('📖 新的星球故事')});$('reset').addEventListener('click',()=>{if(confirm('清空星球重新开始？')){localStorage.removeItem(key);location.reload()}});update();save()})();
</script></body></html>
