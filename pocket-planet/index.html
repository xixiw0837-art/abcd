<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121e38"><title>口袋星球 · 星光岛屿</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#0b1530;color:#fff}body{background:radial-gradient(ellipse at 50% 34%,#334c7c,#101b3b 55%,#0a1126)}main{max-width:590px;margin:auto;padding:17px 13px 35px;text-align:center}.top{font-size:11px;letter-spacing:3px;color:#a9efdf}h1{font-size:30px;margin:6px 0 4px;text-shadow:0 4px 20px #0007}.sub{font-size:12px;color:#c4d7e8;margin-bottom:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.stat{background:#ffffff16;border:1px solid #ffffff24;border-radius:15px;padding:10px 4px;font-size:19px;font-weight:800;backdrop-filter:blur(8px)}.stat small{display:block;font-size:10px;color:#c9d5e8;font-weight:400;margin-top:4px}.view{position:relative;aspect-ratio:1;max-height:57dvh;overflow:hidden;border-radius:24px;background:radial-gradient(ellipse at 50% 50%,#526c94,#182b53 65%,#111c3d);box-shadow:0 15px 55px #0006,inset 0 0 45px #93d4e01a;border:1px solid #b5e9ed44}.view canvas{width:100%;height:100%;display:block;touch-action:none}.pill{position:absolute;top:13px;left:12px;background:#0c1b39b5;border:1px solid #ffffff38;border-radius:20px;padding:7px 12px;font-size:11px;pointer-events:none}.hint{position:absolute;bottom:13px;left:0;right:0;color:#fff;text-shadow:0 2px 9px #000;font-size:11px;pointer-events:none}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#17284a;color:#d7e9ff;padding:25px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}button{border:1px solid #ffffff35;border-radius:15px;background:linear-gradient(140deg,#ffffff30,#ffffff12);color:#fff;font-size:14px;font-weight:750;padding:12px 4px;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.97)}button small{display:block;font-size:10px;font-weight:400;color:#c5d9e6;margin-top:4px}.extras{display:flex;gap:8px;margin-top:9px}.extras button{flex:1;font-size:12px;padding:10px 3px}.message{font-size:13px;min-height:32px;color:#a8ffe4;padding-top:13px}.journal{text-align:left;border:1px solid #ffffff24;background:#ffffff13;border-radius:16px;padding:14px;line-height:1.65;font-size:13px}.journal b{color:#ffe8ae}.footer{color:#95abc8;font-size:10px;margin-top:13px}</style></head><body><main><div class="top">✦ YOUR OWN LITTLE UNIVERSE ✦</div><h1>🌎 口袋星球</h1><div class="sub">星光岛屿 · 一颗会呼吸的童话星球</div><div class="stats"><div class="stat">🌱 <span id="wood">25</span><small>自然能量</small></div><div class="stat">✨ <span id="dust">10</span><small>星尘</small></div><div class="stat">🏡 <span id="people">0</span><small>居民</small></div></div><div class="view" id="view"><div class="pill" id="weather">☀️ 晴朗 · 微风</div><div class="hint">上下左右拖动旋转 · 双指缩放 · 轻触建造</div><div id="loading" class="loading">正在唤醒你的星球…</div></div><div class="actions"><button id="tree">🌲 童话森林<small>🌱 5</small></button><button id="house">🏡 星光小屋<small>🌱 15 ✨ 3</small></button><button id="flower">🌷 梦幻花园<small>🌱 8 ✨ 2</small></button></div><div class="extras"><button id="collect">✨ 收集能量</button><button id="storybtn">📖 星球故事</button><button id="reset">↻ 新星球</button></div><div class="message" id="message">欢迎回家，星球正在等你 ✨</div><div class="journal"><b>📜 星球日记</b><div id="story">第一束阳光落在山顶。你会把这里建成什么样子？</div></div><div class="footer">POCKET PLANET · STARLIGHT ISLAND · V4 · 自动存档</div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);if(!window.THREE){$('loading').textContent='3D 引擎加载失败，请检查网络后重新打开';return}const T=THREE,view=$('view'),KEY='pocket-planet-v1',R=2.28;let state={wood:25,stars:10,items:[],angle:0,last:0,story:0};try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.items))state={...state,...x}}catch(e){}const since=Math.min(12*3600000,Math.max(0,Date.now()-(state.last||Date.now())));if(since>60000){state.wood+=Math.min(140,Math.floor(since/60000)*(1+state.items.filter(i=>i.type==='tree').length));state.stars+=Math.min(60,Math.floor(since/180000))}const save=()=>{state.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};const say=t=>$('message').textContent=t;function update(){$('wood').textContent=Math.floor(state.wood);$('dust').textContent=Math.floor(state.stars);$('people').textContent=state.items.filter(i=>i.type==='house').length*2}const scene=new T.Scene(),camera=new T.PerspectiveCamera(37,1,.1,100);camera.position.set(0,.3,9.7);const renderer=new T.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.8));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.32;view.prepend(renderer.domElement);$('loading').remove();scene.add(new T.HemisphereLight('#b8eaff','#38543b',2.2));const sun=new T.DirectionalLight('#ffe6b7',3.4);sun.position.set(-4,7,8);scene.add(sun);const fill=new T.DirectionalLight('#8cbeff',1.2);fill.position.set(6,-1,-5);scene.add(fill);const orbit=new T.Group(),planet=new T.Group();scene.add(orbit);orbit.add(planet);orbit.rotation.x=-.24;planet.rotation.y=state.angle||0;const mat=(c,roughness=1)=>new T.MeshStandardMaterial({color:c,roughness,flatShading:true}),grass=mat('#7dc68d'),grass2=mat('#a0d69c'),darkGrass=mat('#4c9c83'),sand=mat('#e5c995'),water=mat('#64c6d7',.32),trunk=mat('#93664d'),leaf=mat('#2c907a'),leaf2=mat('#65b982'),pine=mat('#337a75'),stone=mat('#9ba9a6'),snow=mat('#f2f0e3'),wall=mat('#ffdfba'),roof=mat('#e88888'),roof2=mat('#d16e82'),wood=mat('#9c6e59'),pink=mat('#ff8fc0'),purple=mat('#b5a0f2'),yellow=mat('#ffe99b'),windowMat=new T.MeshStandardMaterial({color:'#fff0b2',emissive:'#ffc76e',emissiveIntensity:.8}),cloudMat=new T.MeshStandardMaterial({color:'#f7ffff',transparent:true,opacity:.9,roughness:1});function mesh(geo,m,parent,x=0,y=0,z=0){const o=new T.Mesh(geo,m);o.position.set(x,y,z);parent.add(o);return o}function ball(parent,x,y,z,r,m){return mesh(new T.SphereGeometry(r,10,8),m,parent,x,y,z)}function cylinder(parent,x,y,z,top,bottom,h,m,n=8){return mesh(new T.CylinderGeometry(top,bottom,h,n),m,parent,x,y,z)}function cone(parent,x,y,z,r,h,m,n=8){return mesh(new T.ConeGeometry(r,h,n),m,parent,x,y,z)}const groundGeo=new T.IcosahedronGeometry(R,5),attr=groundGeo.attributes.position,colors=[],C=new T.Color();for(let i=0;i<attr.count;i++){const x=attr.getX(i),y=attr.getY(i),z=attr.getZ(i),v=.034*Math.sin(x*13+y*8)*Math.cos(z*11)+.023*Math.sin(y*19-z*5);const scale=1+v;attr.setXYZ(i,x*scale,y*scale,z*scale);const h=Math.sin(x*6+z*8)*Math.cos(y*5);C.set(h>.35?'#a7d39a':h<-.4?'#5cae8a':'#80c18c');colors.push(C.r,C.g,C.b)}groundGeo.setAttribute('color',new T.Float32BufferAttribute(colors,3));groundGeo.computeVertexNormals();mesh(groundGeo,new T.MeshStandardMaterial({vertexColors:true,roughness:1,flatShading:true}),planet);mesh(new T.SphereGeometry(R*1.025,64,40),new T.MeshStandardMaterial({color:'#7dd6e0',transparent:true,opacity:.13,roughness:.25,depthWrite:false}),planet);const atmosphere=mesh(new T.SphereGeometry(R*1.075,48,32),new T.MeshBasicMaterial({color:'#a9e5ff',transparent:true,opacity:.055,side:T.BackSide}),planet);function direction(i,total=220){const y=1-2*(i+.5)/total,a=i*2.39996323,rad=Math.sqrt(1-y*y);return new T.Vector3(Math.cos(a)*rad,y,Math.sin(a)*rad)}function anchor(n,r=R*1.018){const g=new T.Group();g.position.copy(n.clone().multiplyScalar(r));g.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),n);planet.add(g);return g}function makeTree(g,s=1,variant=0){g.scale.setScalar(s);cylinder(g,0,.15,0,.043,.065,.32,trunk);if(variant===0){cone(g,0,.43,0,.25,.42,pine);cone(g,0,.62,0,.20,.37,leaf);cone(g,0,.79,0,.14,.3,leaf2)}else{ball(g,0,.5,0,.26,leaf);ball(g,-.13,.58,0,.18,leaf2);ball(g,.13,.62,.05,.2,grass2)}}function makeHouse(g){mesh(new T.BoxGeometry(.46,.34,.40),wall,g,0,.19,0);const roofMesh=mesh(new T.ConeGeometry(.37,.32,4),roof,g,0,.52,0);roofMesh.rotation.y=Math.PI/4;mesh(new T.BoxGeometry(.13,.18,.025),wood,g,0,.11,.215);mesh(new T.BoxGeometry(.095,.10,.03),windowMat,g,-.14,.25,.214);mesh(new T.BoxGeometry(.095,.10,.03),windowMat,g,.14,.25,.214);cylinder(g,.24,.36,-.08,.037,.04,.32,stone);ball(g,.24,.54,-.08,.11,cloudMat)}function makeFlower(g){for(let i=0;i<7;i++){const a=i*2.399,r=.07+.08*(i%3);cylinder(g,Math.cos(a)*r,.07,Math.sin(a)*r,.012,.016,.14,leaf);for(let j=0;j<5;j++){const p=j*Math.PI*2/5;ball(g,Math.cos(a)*r+Math.cos(p)*.055,.17,Math.sin(a)*r+Math.sin(p)*.055,.045,i%2?pink:purple)}ball(g,Math.cos(a)*r,.18,Math.sin(a)*r,.035,yellow)}}function makeMountain(g,scale=1){g.scale.setScalar(scale);cone(g,0,.28,0,.28,.56,stone,7);cone(g,0,.55,0,.115,.18,snow,7);ball(g,.24,.04,.15,.13,grass2)}function makeCloud(x,y,z,s){const g=new T.Group();scene.add(g);g.position.set(x,y,z);g.scale.setScalar(s);for(let i=0;i<5;i++)ball(g,(i-2)*.23,.04+Math.sin(i)*.09,0,.22+(i%2)*.05,cloudMat);return g}const clouds=[makeCloud(-3.3,2.8,-1.5,1),makeCloud(3.4,1.9,-1.7,.8),makeCloud(-3,-2.2,-2.8,.7)];for(let i=0;i<170;i++){const n=direction(i,170),g=anchor(n,R*1.025);if(i%17===0){makeMountain(g,.7+(i%4)*.12)}else if(i%5===0){ball(g,0,.08,0,.11,i%2?grass2:darkGrass)}else if(i%9===0){makeFlower(g);g.scale.setScalar(.48)}else{makeTree(g,.48+(i%4)*.1,i%3===0?1:0)}}for(let i=0;i<11;i++){const n=direction(i*13+4,170),g=anchor(n,R*1.035);makeMountain(g,.9+(i%3)*.25)}function decorate(type,i){const n=direction((i*29+7)%170,170),g=anchor(n,R*1.045);if(type==='tree')makeTree(g,1.15,i%3===0?1:0);if(type==='house')makeHouse(g);if(type==='flower')makeFlower(g)}state.items.forEach((it,i)=>decorate(it.type,i));const starg=new T.BufferGeometry(),coords=[];for(let i=0;i<360;i++)coords.push((Math.random()-.5)*27,(Math.random()-.5)*27,(Math.random()-.5)*20-3);starg.setAttribute('position',new T.Float32BufferAttribute(coords,3));scene.add(new T.Points(starg,new T.PointsMaterial({color:'#e4f7ff',size:.035,transparent:true,opacity:.9})));let drag=false,px=0,py=0,pinch=0;const dom=renderer.domElement;dom.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;dom.setPointerCapture(e.pointerId)});dom.addEventListener('pointermove',e=>{if(!drag)return;orbit.rotation.y+=(e.clientX-px)*.008;orbit.rotation.x=Math.max(-1.55,Math.min(1.55,orbit.rotation.x+(e.clientY-py)*.008));px=e.clientX;py=e.clientY});dom.addEventListener('pointerup',()=>{drag=false;state.angle=planet.rotation.y;save()});dom.addEventListener('pointercancel',()=>drag=false);dom.addEventListener('touchmove',e=>{if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.hypot(dx,dy);if(pinch)camera.position.z=Math.max(6.6,Math.min(12,camera.position.z+(pinch-d)*.014));pinch=d}},{passive:true});dom.addEventListener('touchend',()=>pinch=0);function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}if(window.ResizeObserver)new ResizeObserver(resize).observe(view);else window.addEventListener('resize',resize);resize();let frame=0;function animate(){requestAnimationFrame(animate);frame+=.012;if(!drag)planet.rotation.y+=.00065;planet.rotation.z=Math.sin(frame*.13)*.016;clouds.forEach((c,i)=>{c.position.x+=Math.sin(frame*.3+i)*.0007;c.position.y+=Math.cos(frame*.7+i)*.0009});renderer.render(scene,camera)}animate();const costs={tree:[5,0],house:[15,3],flower:[8,2]};['tree','house','flower'].forEach(type=>$(type).addEventListener('click',()=>{const [w,s]=costs[type];if(state.wood<w||state.stars<s){say('资源不够，先收集能量 ✨');return}if(state.items.length>=55){say('星球已经非常繁荣啦！');return}state.wood-=w;state.stars-=s;const i=state.items.length;state.items.push({type});decorate(type,i);if(type==='tree')state.story=Math.max(1,state.story);if(type==='house')state.story=Math.max(2,state.story);if(type==='flower')state.story=Math.max(3,state.story);update();save();say(({tree:'🌲 森林长出了新树！',house:'🏡 星光小屋迎来了居民！',flower:'🌸 花园里开满了花！'})[type])}));$('collect').addEventListener('click',()=>{if(Date.now()-state.last<8000){say('能量正在凝聚，过几秒再来 ⏳');return}state.wood+=10+state.items.filter(i=>i.type==='tree').length*2;state.stars+=3+state.items.filter(i=>i.type==='flower').length;save();update();say('✨ 收集成功！森林和花园会提高收益')});$('storybtn').addEventListener('click',()=>{const lines=['第一束阳光落在山顶。你会把这里建成什么样子？','小狐狸阿橘喜欢在高高的松树下听风。','旅行者米米看到了窗户里的灯光，决定留在星球上。','居民们在花园举办了第一场星光茶会。'];$('story').textContent=lines[Math.min(3,state.story)];say('📖 翻开星球日记')});$('reset').addEventListener('click',()=>{if(confirm('确定清空现有星球，重新开始吗？')){localStorage.removeItem(KEY);location.reload()}});update();save()})();
</script></body></html>
