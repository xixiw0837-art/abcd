<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10152d"><title>口袋星球 · Pocket Planet</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#fff;background:#0c1228}body{background:radial-gradient(ellipse at 50% 40%,#273c70,#0b1025 75%);min-height:100dvh}main{max-width:540px;margin:auto;padding:18px 14px 30px;text-align:center}.eyebrow{letter-spacing:3px;color:#a5e9db;font-size:11px}h1{margin:7px 0 2px;font-size:29px}p{margin:5px 0;color:#b9c7dc;font-size:12px}.resources{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:17px 0 8px}.res{background:#ffffff15;border:1px solid #ffffff1c;border-radius:14px;padding:10px 3px;font-size:16px;font-weight:800}.res small{display:block;font-size:10px;color:#b8c8dd;font-weight:400;margin-top:3px}.scene{position:relative;overflow:hidden;border-radius:25px;border:1px solid #ffffff27;background:radial-gradient(ellipse at center,#324d81 0%,#151d42 60%,#0b122e);box-shadow:0 18px 55px #0005}.scene canvas{display:block;width:100%;aspect-ratio:1/1;touch-action:none}.day{position:absolute;top:13px;left:13px;background:#0c1837aa;border:1px solid #ffffff30;border-radius:30px;padding:7px 12px;font-size:12px}.tip{position:absolute;bottom:13px;left:0;right:0;color:#c3d6f0;font-size:12px;text-shadow:0 2px 5px #000}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}button{border:1px solid #ffffff35;border-radius:16px;padding:13px 5px;background:#ffffff1c;color:white;font-weight:800;font-size:14px;cursor:pointer;touch-action:manipulation}button small{display:block;color:#b9c9d7;font-weight:400;margin-top:5px;font-size:10px}button:active{transform:scale(.97)}button.selected{background:linear-gradient(120deg,#3bbaa5,#4186d2);border-color:#b7fff1}button:disabled{opacity:.5}.bottom{display:flex;justify-content:space-between;gap:8px;margin-top:12px}.bottom button{flex:1;font-size:12px;padding:10px 5px}.log{min-height:34px;color:#b3ffe7;margin-top:12px;font-size:13px;line-height:1.5}.story{margin-top:12px;text-align:left;background:#ffffff12;border:1px solid #ffffff18;padding:13px 15px;border-radius:16px;font-size:13px;line-height:1.7;color:#dce7f6}.story strong{color:#fff}.foot{font-size:10px;color:#8c9bb9;margin-top:13px}</style></head><body><main><div class="eyebrow">A LITTLE WORLD OF YOUR OWN</div><h1>🪐 口袋星球</h1><p>种下一片森林，点亮一座小镇，让星球慢慢苏醒</p><div class="resources"><div class="res">🌱 <span id="wood">25</span><small>自然能量</small></div><div class="res">✨ <span id="stars">10</span><small>星尘</small></div><div class="res">👨‍👩‍👧 <span id="people">0</span><small>居民</small></div></div><div class="scene"><canvas id="world" width="640" height="640" aria-label="可拖动旋转的星球"></canvas><div class="day" id="clock">☀️ 白昼</div><div class="tip">↔ 拖动星球旋转 · 点击下方按钮建造</div></div><div class="actions"><button id="tree">🌳 种树<small>🌱 5</small></button><button id="house">🏡 建房<small>🌱 15 · ✨ 3</small></button><button id="flower">🌸 花园<small>🌱 8 · ✨ 2</small></button></div><div class="bottom"><button id="collect">🌟 收集资源</button><button id="visit">💌 居民故事</button><button id="reset">↻ 重新开始</button></div><div class="log" id="log" aria-live="polite">欢迎来到属于你的第一颗星球 ✨</div><div class="story" id="story"><strong>星球日记 · 第一天</strong><div id="storyText">宇宙很大，但这颗小星球正等待你的第一棵树。</div></div><div class="foot">POCKET PLANET · 试玩版 v1 · 自动保存在本机</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d');const key='pocket-planet-v1';let state={wood:25,stars:10,items:[],angle:0,created:Date.now(),last:Date.now(),story:0};try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&Array.isArray(saved.items))state={...state,...saved}}catch(e){}let selected=null,dragging=false,lastX=0,starsBg=Array.from({length:65},(_,i)=>({x:(i*163+37)%640,y:(i*277+83)%640,r:1+(i%3)*.45}));const stories=['宇宙很大，但这颗小星球正等待你的第一棵树。','小狐狸阿橘说：我想在一棵树下看星星。','旅行者米米说：如果这里有一座温暖的小屋，我就留下来。','居民们开始互相串门。夜晚亮起的窗户，是宇宙里最小的灯塔。','有人把花种在路边，并留下纸条：希望明天也能见到你。'];function save(){state.last=Date.now();try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}function notify(s){$('log').textContent=s}function update(){const houses=state.items.filter(x=>x.type==='house').length;$('wood').textContent=Math.floor(state.wood);$('stars').textContent=Math.floor(state.stars);$('people').textContent=houses*2;$('tree').classList.toggle('selected',selected==='tree');$('house').classList.toggle('selected',selected==='house');$('flower').classList.toggle('selected',selected==='flower');$('storyText').textContent=stories[Math.min(state.story,stories.length-1)]}function add(type){const costs={tree:[5,0],house:[15,3],flower:[8,2]},cost=costs[type];if(state.wood<cost[0]||state.stars<cost[1]){notify('资源不够啦！先点击「收集资源」✨');return}if(state.items.length>=32){notify('星球已经很热闹啦！下一版会开放新区域。');return}state.wood-=cost[0];state.stars-=cost[1];const i=state.items.length;const a=((i*137.508)%360)*Math.PI/180;state.items.push({type,a});if(type==='tree'&&state.story<1)state.story=1;if(type==='house'&&state.story<2)state.story=2;if(state.items.filter(x=>x.type==='house').length>=3&&state.story<3)state.story=3;if(state.items.filter(x=>x.type==='flower').length>=3&&state.story<4)state.story=4;save();update();notify(({tree:'一棵新树在星球上扎根了 🌳',house:'新居民搬进了温暖的小屋 🏡',flower:'花园里开出了第一朵花 🌸'})[type]);}['tree','house','flower'].forEach(t=>$(t).addEventListener('click',()=>add(t)));$('collect').addEventListener('click',()=>{const now=Date.now();if(now-state.last<8000){notify('资源正在凝聚中，稍等几秒再收集 ⏳');return}state.wood+=10+state.items.filter(x=>x.type==='tree').length*2;state.stars+=3+state.items.filter(x=>x.type==='flower').length;save();update();notify('收集成功！树木和花园会增加每次的收益 ✨')});$('visit').addEventListener('click',()=>{const houses=state.items.filter(x=>x.type==='house').length;notify(houses?'💌 '+stories[Math.min(state.story,stories.length-1)]:'先建一间小屋，居民才会来讲故事哦。')});$('reset').addEventListener('click',()=>{if(!confirm('确定重新开始吗？现有星球将被清空。'))return;state={wood:25,stars:10,items:[],angle:0,created:Date.now(),last:0,story:0};save();update();notify('新的旅程开始了 ✨')});function down(e){dragging=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)}canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',e=>{if(!dragging)return;state.angle+=(e.clientX-lastX)*.008;lastX=e.clientX});canvas.addEventListener('pointerup',()=>{dragging=false;save()});canvas.addEventListener('pointercancel',()=>{dragging=false});const TAU=Math.PI*2;function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=color;ctx.fill()}function draw(t){const night=(Math.sin(t/13000)+1)/2;ctx.clearRect(0,0,640,640);const bg=ctx.createRadialGradient(320,320,60,320,320,440);bg.addColorStop(0,night>.55?'#30436f':'#1b2d60');bg.addColorStop(1,'#0b122e');ctx.fillStyle=bg;ctx.fillRect(0,0,640,640);starsBg.forEach(s=>{ctx.globalAlpha=.35+.55*Math.abs(Math.sin(t/1200+s.x));circle(s.x,s.y,s.r,'#ffffff')});ctx.globalAlpha=1;const cx=320,cy=332,R=207;const halo=ctx.createRadialGradient(cx,cy,R-10,cx,cy,R+45);halo.addColorStop(0,'#a7fff000');halo.addColorStop(.4,'#79ffe330');halo.addColorStop(1,'#79ffe300');circle(cx,cy,R+45,halo);const g=ctx.createRadialGradient(cx-70,cy-85,20,cx,cy,R);g.addColorStop(0,night>.55?'#91c8a5':'#b5f4a2');g.addColorStop(.55,night>.55?'#3a958c':'#61c18d');g.addColorStop(1,'#276478');circle(cx,cy,R,g);ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.clip();for(let i=0;i<11;i++){const a=i*2.399+state.angle*.55,rr=R*.63;circle(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,20+i%4*9,i%2?'#6ecb9b77':'#d3e8a577')}ctx.restore();const sorted=state.items.map(it=>({...it,depth:Math.cos(it.a+state.angle),x:cx+Math.sin(it.a+state.angle)*R*.88,y:cy+Math.sin(it.a*.7+state.angle*.35)*R*.28})).sort((a,b)=>a.depth-b.depth);sorted.forEach(it=>{if(it.depth<-.15)return;const sc=.55+.45*(it.depth+1)/2;ctx.save();ctx.translate(it.x,it.y);ctx.scale(sc,sc);if(it.type==='tree'){ctx.fillStyle='#74564b';ctx.fillRect(-5,-5,10,35);circle(0,-19,24,'#216b5e');circle(-13,-28,17,'#41b781');circle(12,-30,19,'#65dc9a')}else if(it.type==='house'){ctx.fillStyle='#ffe6ba';ctx.fillRect(-25,-12,50,39);ctx.fillStyle='#ef7b85';ctx.beginPath();ctx.moveTo(-32,-12);ctx.lineTo(0,-39);ctx.lineTo(32,-12);ctx.fill();ctx.fillStyle=night>.55?'#ffe78b':'#76b9e8';ctx.fillRect(-13,0,12,13);ctx.fillRect(8,0,12,13);ctx.fillStyle='#9e715c';ctx.fillRect(-4,12,9,15)}else{for(let j=0;j<5;j++){const a=j*TAU/5;circle(Math.cos(a)*12,Math.sin(a)*12-8,11,'#ffa9d6')}circle(0,-8,9,'#ffe47a')}ctx.restore()});const shade=ctx.createLinearGradient(cx-180,cy-120,cx+220,cy+150);shade.addColorStop(0,'#09142b00');shade.addColorStop(1,night>.55?'#06102d99':'#09204a55');circle(cx,cy,R,shade);$('clock').textContent=night>.55?'🌙 星光之夜':'☀️ 温暖白昼';requestAnimationFrame(draw)}const elapsed=Math.max(0,Math.min(12*3600*1000,Date.now()-state.last));if(elapsed>60000){const ticks=Math.floor(elapsed/60000);state.wood+=Math.min(100,ticks*(1+state.items.filter(x=>x.type==='tree').length));state.stars+=Math.min(50,Math.floor(ticks/3));notify('欢迎回来！星球为你积攒了离线资源 ✨')}save();update();requestAnimationFrame(draw)})();
</script></body></html>
